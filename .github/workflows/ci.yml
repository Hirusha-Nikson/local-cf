name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

# Fork PRs run untrusted code (pnpm lifecycle scripts included), so the job
# token is explicitly read-only rather than inheriting the repo default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Third-party actions are pinned to a commit SHA: a version tag can be
      # moved to point at new code, a SHA cannot.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @local-cf/core build

      - name: Build sidecar
        run: pnpm --filter @local-cf/sidecar build

      - name: Typecheck
        run: pnpm --filter '!@local-cf/sidecar' -r typecheck

      - name: Build
        run: pnpm --filter '!@local-cf/sidecar' -r build
