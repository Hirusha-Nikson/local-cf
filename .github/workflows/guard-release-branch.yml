name: Guard release branch

# Ensures `release` only ever receives merges from `main`, since GitHub
# branch protection has no native "only allow this source branch" rule.
on:
  pull_request:
    branches:
      - release
    types: [opened, synchronize, reopened, edited]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if source branch is not main
        run: |
          if [ "${{ github.event.pull_request.head.ref }}" != "main" ]; then
            echo "::error::PRs into release must come from main (got '${{ github.event.pull_request.head.ref }}')."
            exit 1
          fi
