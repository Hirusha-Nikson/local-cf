name: Deploy site

on:
  push:
    branches:
      - main
      - release
    paths:
      - "apps/site/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-site.yml"

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy (${{ github.ref_name == 'release' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'release' && 'production' || 'staging' }}
    permissions:
      contents: read
    steps:
      # This job can read the Cloudflare deploy credentials, so every action it
      # runs is pinned to a commit SHA rather than a movable version tag.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, not the default depth-1 clone. src/app/sitemap.ts
          # dates each URL from `git log -1` on the page file: with a shallow
          # clone that command returns nothing for any page not touched by the
          # head commit, so <lastmod> would vanish for most of the site and
          # read as "changed today" for the rest.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @local-cf/ui imports types from @local-cf/sidecar's build output.
      - name: Build workspace packages
        run: pnpm build

      - name: Build site (OpenNext)
        run: pnpm --filter @local-cf/site cf:build

      - name: Deploy to staging (main)
        if: github.ref_name == 'main'
        run: pnpm --filter @local-cf/site cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to production (release)
        if: github.ref_name == 'release'
        run: pnpm --filter @local-cf/site cf:deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
