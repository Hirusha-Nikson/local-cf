name: Deploy site

on:
  push:
    branches:
      - main
      - release
    paths:
      - "apps/site/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-site.yml"

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy (${{ github.ref_name == 'release' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'release' && 'production' || 'staging' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @local-cf/ui imports types from @local-cf/sidecar's build output.
      - name: Build workspace packages
        run: pnpm build

      - name: Build site (OpenNext)
        run: pnpm --filter @local-cf/site cf:build

      - name: Deploy to staging (main)
        if: github.ref_name == 'main'
        run: pnpm --filter @local-cf/site cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to production (release)
        if: github.ref_name == 'release'
        run: pnpm --filter @local-cf/site cf:deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
